<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" aria-labelledby="title desc">
<title id="title">无影 SDK 能力地图</title>
<desc id="desc">Client 是统一集成入口。四类能力为：云资源（Runtime、ASP 流化、远程脚本、端口服务）；AI 能力（Agent、Conversation、Skill、Model）；存储能力（WyDrive、KnowledgeSpace）；计量（Credit）。各能力的认证与平台支持以模型页为准。</desc>
<rect width="1000" height="916" fill="#111318"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><rect x="24" y="16" width="952" height="136" rx="18" fill="#352319" stroke="#FB923C" stroke-width="1.5"/><text x="500.0" y="59" font-size="30" font-weight="700" fill="#F5F5F4" text-anchor="middle">Wuying SDK · Client</text><text x="500.0" y="92" font-size="21" font-weight="500" fill="#F5F5F4" text-anchor="middle">无影对外集成能力的统一入口</text><text x="500.0" y="126" font-size="18" font-weight="400" fill="#B4BBC5" text-anchor="middle">认证与授权  ·  生命周期  ·  能力入口</text><path d="M500 152v30" fill="none" stroke="#FB923C" stroke-width="2"/><rect x="8" y="182" width="984" height="668" rx="24" fill="#111318" stroke="#343942" stroke-width="1.5"/><text x="32" y="217" font-size="18" font-weight="600" fill="#B4BBC5">四类集成能力</text><rect x="24" y="236" width="466" height="350" rx="18" fill="#191C22" stroke="#343942" stroke-width="1.5"/><rect x="42" y="254" width="46" height="46" rx="12" fill="#352319"/><g transform="translate(51 263)" fill="none" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="24" height="17" rx="3"/><path d="M9 26h10M14 20v6"/></g><text x="102" y="277" font-size="26" font-weight="700" fill="#F5F5F4">云资源</text><text x="470" y="277" font-size="17" font-weight="400" fill="#B4BBC5" text-anchor="end">管理与控制</text><text x="48" y="335" font-size="22" font-weight="650" fill="#F5F5F4">Runtime</text><text x="48" y="362" font-size="19" font-weight="400" fill="#B4BBC5">云桌面创建、启停与管理</text><text x="48" y="399" font-size="22" font-weight="650" fill="#F5F5F4">ASP 流化</text><text x="48" y="426" font-size="19" font-weight="400" fill="#B4BBC5">桌面与应用画面接入</text><text x="48" y="463" font-size="22" font-weight="650" fill="#F5F5F4">远程脚本</text><text x="48" y="490" font-size="19" font-weight="400" fill="#B4BBC5">执行系统命令、启动应用</text><text x="48" y="527" font-size="22" font-weight="650" fill="#F5F5F4">端口服务</text><text x="48" y="554" font-size="19" font-weight="400" fill="#B4BBC5">访问资源内已配置的服务</text><rect x="510" y="236" width="466" height="350" rx="18" fill="#191C22" stroke="#343942" stroke-width="1.5"/><rect x="528" y="254" width="46" height="46" rx="12" fill="#352319"/><g transform="translate(537 263)" fill="none" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 1 3.6 9.4L27 14l-9.4 3.6L14 27l-3.6-9.4L1 14l9.4-3.6Z"/></g><text x="588" y="277" font-size="26" font-weight="700" fill="#F5F5F4">AI 能力</text><text x="956" y="277" font-size="17" font-weight="400" fill="#B4BBC5" text-anchor="end">任务与交互</text><text x="534" y="335" font-size="22" font-weight="650" fill="#F5F5F4">Agent</text><text x="534" y="362" font-size="19" font-weight="400" fill="#B4BBC5">发现与调用智能体</text><text x="534" y="399" font-size="22" font-weight="650" fill="#F5F5F4">Conversation</text><text x="534" y="426" font-size="19" font-weight="400" fill="#B4BBC5">会话、消息与任务执行</text><text x="534" y="463" font-size="22" font-weight="650" fill="#F5F5F4">Skill</text><text x="534" y="490" font-size="19" font-weight="400" fill="#B4BBC5">技能查询、安装与管理</text><text x="534" y="527" font-size="22" font-weight="650" fill="#F5F5F4">Model</text><text x="534" y="554" font-size="19" font-weight="400" fill="#B4BBC5">模型目录与会话模型选择</text><rect x="24" y="606" width="466" height="222" rx="18" fill="#191C22" stroke="#343942" stroke-width="1.5"/><rect x="42" y="624" width="46" height="46" rx="12" fill="#352319"/><g transform="translate(51 633)" fill="none" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="6" rx="11" ry="4"/><path d="M3 6v16c0 5 22 5 22 0V6M3 14c0 5 22 5 22 0"/></g><text x="102" y="647" font-size="26" font-weight="700" fill="#F5F5F4">存储能力</text><text x="470" y="647" font-size="17" font-weight="400" fill="#B4BBC5" text-anchor="end">文件与知识</text><text x="48" y="705" font-size="22" font-weight="650" fill="#F5F5F4">WyDrive</text><text x="48" y="732" font-size="19" font-weight="400" fill="#B4BBC5">云盘空间与文件查询</text><text x="48" y="769" font-size="22" font-weight="650" fill="#F5F5F4">KnowledgeSpace</text><text x="48" y="796" font-size="19" font-weight="400" fill="#B4BBC5">知识空间与知识文件查询</text><rect x="510" y="606" width="466" height="158" rx="18" fill="#191C22" stroke="#343942" stroke-width="1.5"/><rect x="528" y="624" width="46" height="46" rx="12" fill="#352319"/><g transform="translate(537 633)" fill="none" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 24V14h5v10M12 24V4h5v20M21 24V9h5v15"/></g><text x="588" y="647" font-size="26" font-weight="700" fill="#F5F5F4">计量</text><text x="956" y="647" font-size="17" font-weight="400" fill="#B4BBC5" text-anchor="end">套餐与用量</text><text x="534" y="705" font-size="22" font-weight="650" fill="#F5F5F4">Credit</text><text x="534" y="732" font-size="19" font-weight="400" fill="#B4BBC5">套餐、用量与明细查询</text><text x="500.0" y="890" font-size="19" font-weight="400" fill="#B4BBC5" text-anchor="middle">按当前身份授权访问；认证方式、平台支持与接口范围以对应模型页为准。</text></g>
</svg>
